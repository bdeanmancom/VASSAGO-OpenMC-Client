name: Release

# Builds the installers on all three platforms and attaches them to a GitHub Release.
# Run it from the Actions tab (or `gh workflow run release.yml -f tag=v0.2.0`), or push a v* tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create or update, e.g. v0.2.0'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: true
  push:
    tags: ['v*']

# Only the publish job may write (it creates the tag and the release).
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json and must not point at another commit
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          case "$TAG" in
            "$version"|"$version"-*) ;;
            *) echo "::error::Tag $TAG does not match the version in package.json ($version). The installers are named after package.json."; exit 1 ;;
          esac
          # the commit an existing tag points at (annotated tags need peeling)
          existing="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          [ -n "$existing" ] || existing="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG already exists at $existing, but this run builds $GITHUB_SHA. Re-running would attach installers from one commit to a tag on another. Bump the version, or delete the tag and its release first."
            exit 1
          fi

  build:
    needs: check
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, script: 'dist:linux' }
          - { name: windows, os: windows-latest, script: 'dist:win' }
          # GitHub sometimes has no hosted macOS runner for an image and cancels the job unrun.
          # Two images are tried; they build the same files and either result is used.
          - { name: macos, os: macos-15, script: 'dist:mac' }
          - { name: macos-alt, os: macos-latest, script: 'dist:mac' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          # The installers are unsigned. Signing needs the certificate secrets mapped into this
          # step's env and this switch removed; docs/PACKAGING.md lists what each platform needs.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*-mac-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [check, build]
    # Publish whatever was built even if one build job did not run; the last step then fails
    # the run if a platform is missing, and "Re-run failed jobs" completes the release later.
    if: ${{ always() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Vassago ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || (github.event_name != 'workflow_dispatch' && contains(github.ref_name, '-')) }}
          body_path: docs/RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
      - name: Every platform must be there
        run: |
          missing=0
          for pattern in '*-windows-x64-setup.exe' '*-mac-arm64.dmg' '*-mac-x64.dmg' '*-linux-x86_64.AppImage'; do
            if ! ls artifacts/$pattern >/dev/null 2>&1; then echo "::error::No file matching $pattern was built. The release is incomplete: re-run the failed jobs."; missing=1; fi
          done
          exit $missing
